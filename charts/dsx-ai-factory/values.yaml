#
# Red Hat overrides for the upstream nico umbrella chart.
# Image tags are pinned by release.yml via sed before helm package.
#
# Upstream chart reference:
#   components/infra-controller/helm/

# ---------------------------------------------------------------------------
# RMS (rack-manager chart)
# ---------------------------------------------------------------------------
rack-manager:
  global:
    image:
      tag: latest   # replaced by release.yml: nv-rms:.*
      pullPolicy: IfNotPresent

  apiServer:
    image:
      repository: ghcr.io/rh-ecosystem-edge/dsx-ai-factory/nv-rms
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault

# ---------------------------------------------------------------------------
# Core services (nico umbrella chart)
# ---------------------------------------------------------------------------
nico:
  global:
    image:
      repository: ghcr.io/rh-ecosystem-edge/dsx-ai-factory/infra-controller-core
      tag: latest   # replaced by release.yml: infra-controller-core:.*
      pullPolicy: IfNotPresent

  unbound:
    image:
      repository: ghcr.io/rh-ecosystem-edge/dsx-ai-factory/unbound
      tag: latest   # replaced by release.yml: unbound:.*

  # OpenShift: restricted SCC requires non-root, no privilege escalation
  # These defaults are overridable per subchart (fix/openshift-compatibility)
  nico-api:
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault

  nico-pxe:
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault

  nico-dhcp:
