#
# Runs on push to a YY.MM release branch or a vYY.MM.* tag.
# - Publishes container images to GHCR tagged with the component version
#   (e.g. infra-controller-core:v2.2.0-rh.1 when patches are applied)
# - Publishes Helm charts to GHCR (OCI) with image tags pinned in values.yaml
# - Deploys Hugo docs to GitHub Pages

name: Release

on:
  push:
    branches:
      - '[0-9][0-9].[0-9][0-9]'
    tags:
      - 'v*'

env:
  IMAGE_REGISTRY: ghcr.io/rh-ecosystem-edge/dsx-ai-factory
  CHART_REGISTRY: oci://ghcr.io/rh-ecosystem-edge/dsx-ai-factory/charts

jobs:
  # ---------------------------------------------------------------------------
  # Compute component versions
  # ---------------------------------------------------------------------------
  versions:
    runs-on: ubuntu-latest
    outputs:
      infra_controller: ${{ steps.versions.outputs.infra_controller }}
      nv_rms: ${{ steps.versions.outputs.nv_rms }}
      nvsentinel: ${{ steps.versions.outputs.nvsentinel }}
      fia: ${{ steps.versions.outputs.fia }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Compute versions
        id: versions
        run: |
          component_version() {
            local path="$1"
            local name="$2"
            # Get upstream base tag from the submodule (v* only; skip rh/* protective tags)
            local tag
            tag=$(git -C "$path" describe --tags --abbrev=0 --match='v[0-9]*' 2>/dev/null \
              || git -C "$path" rev-parse --short HEAD)
            # Append -rh.1 suffix when component is in patch state
            if [ -s "patches/${name}/PATCHES.md" ]; then
              echo "${tag}-rh.1"
            else
              echo "${tag}"
            fi
          }
          echo "infra_controller=$(component_version components/infra-controller infra-controller)" >> "$GITHUB_OUTPUT"
          echo "nv_rms=$(component_version components/nv-rms nv-rms)"                             >> "$GITHUB_OUTPUT"
          echo "nvsentinel=$(component_version components/nvsentinel nvsentinel)"                  >> "$GITHUB_OUTPUT"
          echo "fia=$(component_version components/fia fia)"                                       >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Publish infra-controller images
  # ---------------------------------------------------------------------------
  publish-infra-controller:
    needs: versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.versions.outputs.infra_controller }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: infra-controller-rest-api
            dockerfile: docker/infra-controller/Dockerfile.infra-controller-rest-api
            context: components/infra-controller/rest-api/
            rhsm: false
            build_args: VERSION
          - name: infra-controller-rest-cert-manager
            dockerfile: docker/infra-controller/Dockerfile.infra-controller-rest-cert-manager
            context: components/infra-controller/rest-api/
            rhsm: false
          - name: infra-controller-rest-db
            dockerfile: docker/infra-controller/Dockerfile.infra-controller-rest-db
            context: components/infra-controller/rest-api/
            rhsm: false
          - name: infra-controller-rest-site-agent
            dockerfile: docker/infra-controller/Dockerfile.infra-controller-rest-site-agent
            context: components/infra-controller/rest-api/
            rhsm: false
          - name: infra-controller-rest-site-manager
            dockerfile: docker/infra-controller/Dockerfile.infra-controller-rest-site-manager
            context: components/infra-controller/rest-api/
            rhsm: false
          - name: infra-controller-rest-workflow
            dockerfile: docker/infra-controller/Dockerfile.infra-controller-rest-workflow
            context: components/infra-controller/rest-api/
            rhsm: false
          - name: infra-controller-flow
            dockerfile: docker/infra-controller/Dockerfile.infra-controller-flow
            context: components/infra-controller/rest-api/
            rhsm: false
          - name: infra-controller-psm
            dockerfile: docker/infra-controller/Dockerfile.infra-controller-psm
            context: components/infra-controller/rest-api/
            rhsm: false
          - name: infra-controller-cli
            dockerfile: docker/infra-controller/Dockerfile.infra-controller-cli
            context: components/infra-controller/rest-api/
            rhsm: false
          - name: infra-controller-nsm
            dockerfile: docker/infra-controller/Dockerfile.infra-controller-nsm
            context: components/infra-controller/rest-api/
            rhsm: true
          - name: infra-controller-core
            dockerfile: docker/infra-controller/Dockerfile.infra-controller-core
            context: components/infra-controller/
            rhsm: true
            build_args: VERSION
          # infra-controller-pxe is built and pushed manually (requires privileged runner for mkosi)
          - name: unbound
            dockerfile: docker/infra-controller/Dockerfile.unbound
            context: docker/infra-controller/
            rhsm: true
          - name: infra-controller-ntp
            dockerfile: docker/infra-controller/Dockerfile.infra-controller-ntp
            context: docker/infra-controller/
            rhsm: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (no RHSM)
        if: ${{ !matrix.image.rhsm }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ env.IMAGE_REGISTRY }}/${{ matrix.image.name }}:${{ env.VERSION }}
          build-args: ${{ matrix.image.build_args && format('VERSION={0}', env.VERSION) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (RHSM)
        if: ${{ matrix.image.rhsm }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ env.IMAGE_REGISTRY }}/${{ matrix.image.name }}:${{ env.VERSION }}
          build-args: ${{ matrix.image.build_args && format('VERSION={0}', env.VERSION) || '' }}
          secrets: |
            rhsm_org=${{ secrets.RHSM_ORG }}
            rhsm_activationkey=${{ secrets.RHSM_ACTIVATIONKEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Publish infra-controller-admin-cli (depends on core image)
  # ---------------------------------------------------------------------------
  publish-infra-controller-admin-cli:
    needs: [versions, publish-infra-controller]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.versions.outputs.infra_controller }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          file: docker/infra-controller/Dockerfile.infra-controller-admin-cli
          push: true
          tags: ${{ env.IMAGE_REGISTRY }}/infra-controller-admin-cli:${{ env.VERSION }}
          build-args: |
            INFRA_CONTROLLER_CORE_IMAGE=${{ env.IMAGE_REGISTRY }}/infra-controller-core:${{ env.VERSION }}

  # ---------------------------------------------------------------------------
  # Publish nv-rms image
  # ---------------------------------------------------------------------------
  publish-nv-rms:
    needs: versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.versions.outputs.nv_rms }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: components/nv-rms/
          file: docker/rms/Dockerfile.rms
          push: true
          tags: ${{ env.IMAGE_REGISTRY }}/nv-rms:${{ env.VERSION }}
          secrets: |
            rhsm_org=${{ secrets.RHSM_ORG }}
            rhsm_activationkey=${{ secrets.RHSM_ACTIVATIONKEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Publish upstream component charts as OCI artifacts
  # (nico, nico-rest, rack-manager — referenced by nic-core deployment)
  # ---------------------------------------------------------------------------
  publish-component-charts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io \
                --username ${{ github.actor }} \
                --password-stdin

      - name: Package and push component charts
        run: |
          mkdir -p /tmp/component-charts
          push_chart() {
            local path="$1"
            helm dependency build "$path" 2>/dev/null || true
            local pkg
            pkg=$(helm package "$path" --destination /tmp/component-charts/ | awk '{print $NF}')
            helm push "$pkg" "$CHART_REGISTRY"
          }
          push_chart components/infra-controller/helm
          push_chart components/infra-controller/helm/rest/nico-rest
          push_chart components/nv-rms/helm

  # ---------------------------------------------------------------------------
  # Publish our Helm charts (cloud-infra, site-infra, prereqs)
  # These use helm dependency build (local subcharts), not OCI pull.
  # ---------------------------------------------------------------------------
  publish-charts:
    needs:
      - versions
      - publish-infra-controller
      - publish-infra-controller-admin-cli
      - publish-nv-rms
      - publish-component-charts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io \
                --username ${{ github.actor }} \
                --password-stdin

      - name: Pin image tags in value overlay files
        env:
          NICO_VERSION: ${{ needs.versions.outputs.infra_controller }}
          RMS_VERSION: ${{ needs.versions.outputs.nv_rms }}
        run: |
          # Pin image tags in charts/values/ overlay files before packaging
          for f in charts/values/*.yaml; do
            sed -i \
              -e "s|infra-controller-core:.*|infra-controller-core:${NICO_VERSION}|g" \
              -e "s|infra-controller-rest-api:.*|infra-controller-rest-api:${NICO_VERSION}|g" \
              -e "s|infra-controller-rest-cert-manager:.*|infra-controller-rest-cert-manager:${NICO_VERSION}|g" \
              -e "s|infra-controller-rest-db:.*|infra-controller-rest-db:${NICO_VERSION}|g" \
              -e "s|infra-controller-rest-site-agent:.*|infra-controller-rest-site-agent:${NICO_VERSION}|g" \
              -e "s|infra-controller-rest-site-manager:.*|infra-controller-rest-site-manager:${NICO_VERSION}|g" \
              -e "s|infra-controller-rest-workflow:.*|infra-controller-rest-workflow:${NICO_VERSION}|g" \
              -e "s|infra-controller-flow:.*|infra-controller-flow:${NICO_VERSION}|g" \
              -e "s|infra-controller-ntp:.*|infra-controller-ntp:${NICO_VERSION}|g" \
              -e "s|unbound:.*|unbound:${NICO_VERSION}|g" \
              -e "/repository:.*nv-rms/{n;s|tag:.*|tag: ${RMS_VERSION}|}" \
              "$f"
          done

      - name: Package and push charts
        run: |
          mkdir -p /tmp/charts
          for chart in charts/cloud-infra charts/site-infra charts/prereqs; do
            [ -f "$chart/Chart.yaml" ] || continue
            helm dependency build "$chart" 2>/dev/null || true
            pkg=$(helm package "$chart" --destination /tmp/charts/ | awk '{print $NF}')
            helm push "$pkg" "$CHART_REGISTRY"
          done

  # ---------------------------------------------------------------------------
  # Deploy Hugo docs to GitHub Pages
  # ---------------------------------------------------------------------------
  deploy-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'

      - name: Build docs
        run: hugo --source docs/ --minify

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/public/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
