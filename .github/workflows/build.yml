#
# Runs on every pull request.
# - Builds container images (no push); RHSM images skipped when secrets absent
# - Lints Helm charts and validates template rendering
# - Checks Hugo docs build

name: Build

on:
  pull_request:
    branches:
      - main
      - '[0-9][0-9].[0-9][0-9]'

jobs:
  # ---------------------------------------------------------------------------
  # Go images — no RHSM required, build in parallel
  # ---------------------------------------------------------------------------
  build-go-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: infra-controller-rest-api
            dockerfile: docker/infra-controller/Dockerfile.infra-controller-rest-api
            context: components/infra-controller/rest-api/
          - name: infra-controller-rest-cert-manager
            dockerfile: docker/infra-controller/Dockerfile.infra-controller-rest-cert-manager
            context: components/infra-controller/rest-api/
          - name: infra-controller-rest-db
            dockerfile: docker/infra-controller/Dockerfile.infra-controller-rest-db
            context: components/infra-controller/rest-api/
          - name: infra-controller-rest-site-agent
            dockerfile: docker/infra-controller/Dockerfile.infra-controller-rest-site-agent
            context: components/infra-controller/rest-api/
          - name: infra-controller-rest-site-manager
            dockerfile: docker/infra-controller/Dockerfile.infra-controller-rest-site-manager
            context: components/infra-controller/rest-api/
          - name: infra-controller-rest-workflow
            dockerfile: docker/infra-controller/Dockerfile.infra-controller-rest-workflow
            context: components/infra-controller/rest-api/
          - name: infra-controller-flow
            dockerfile: docker/infra-controller/Dockerfile.infra-controller-flow
            context: components/infra-controller/rest-api/
          - name: infra-controller-psm
            dockerfile: docker/infra-controller/Dockerfile.infra-controller-psm
            context: components/infra-controller/rest-api/
          - name: infra-controller-cli
            dockerfile: docker/infra-controller/Dockerfile.infra-controller-cli
            context: components/infra-controller/rest-api/
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # RHSM images — require secrets; skipped on PRs from forks
  # ---------------------------------------------------------------------------
  build-rhsm-images:
    runs-on: ubuntu-latest
    if: vars.HAS_RHSM == 'true'
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: infra-controller-core
            dockerfile: docker/infra-controller/Dockerfile.infra-controller-core
            context: components/infra-controller/
          - name: infra-controller-nsm
            dockerfile: docker/infra-controller/Dockerfile.infra-controller-nsm
            context: components/infra-controller/rest-api/
          - name: unbound
            dockerfile: docker/infra-controller/Dockerfile.unbound
            context: docker/infra-controller/
          - name: infra-controller-ntp
            dockerfile: docker/infra-controller/Dockerfile.infra-controller-ntp
            context: docker/infra-controller/
          - name: nv-rms
            dockerfile: docker/rms/Dockerfile.rms
            context: components/nv-rms/
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.image.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: false
          secrets: |
            rhsm_org=${{ secrets.RHSM_ORG }}
            rhsm_activationkey=${{ secrets.RHSM_ACTIVATIONKEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # PXE image — requires privileged runner and RHSM secrets
  # Skipped on PRs from forks; runs on self-hosted privileged runner when available
  # ---------------------------------------------------------------------------
  build-pxe-image:
    runs-on: ubuntu-latest
    if: vars.HAS_RHSM == 'true'
    continue-on-error: true  # mkosi requires unprivileged user namespaces; not available on standard runners
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build infra-controller-pxe
        # mkosi requires mount namespace capabilities (SYS_ADMIN equivalent).
        # GitHub-hosted runners do not support --privileged; this step will
        # fail on standard runners and should be moved to a self-hosted
        # privileged runner when available.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/infra-controller/Dockerfile.infra-controller-pxe
          push: false
          build-args: VERSION=dev
          secrets: |
            rhsm_org=${{ secrets.RHSM_ORG }}
            rhsm_activationkey=${{ secrets.RHSM_ACTIVATIONKEY }}

  # ---------------------------------------------------------------------------
  # Helm lint
  # ---------------------------------------------------------------------------
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint charts
        run: |
          for chart in charts/*/; do
            [ -f "$chart/Chart.yaml" ] || continue
            echo "==> helm lint $chart"
            helm dependency build "$chart" 2>/dev/null || true
            helm lint "$chart"
          done

  # ---------------------------------------------------------------------------
  # Hugo docs build check
  # ---------------------------------------------------------------------------
  docs-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'

      - name: Build docs
        run: hugo --source docs/ --minify
