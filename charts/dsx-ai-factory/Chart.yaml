apiVersion: v2
name: dsx-ai-factory
description: >
  Red Hat build of DSX AI Factory. Deploys NVIDIA Infra Controller (NICo)
  and Rack Management Service (RMS) on the management cluster.
type: application
version: 0.1.0
appVersion: "0.1.0"

# Component charts are published to GHCR as OCI artifacts by release.yml
# before this umbrella is packaged. For local development see CONTRIBUTING.md.
dependencies:
  - name: nico
    version: "0.1.1"
    repository: "oci://ghcr.io/rh-ecosystem-edge/dsx-ai-factory/charts"
  - name: nico-rest
    version: "0.1.13"
    repository: "oci://ghcr.io/rh-ecosystem-edge/dsx-ai-factory/charts"
  - name: rack-manager
    version: "1.1.2"
    repository: "oci://ghcr.io/rh-ecosystem-edge/dsx-ai-factory/charts"
