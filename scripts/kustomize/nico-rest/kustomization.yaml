apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - all.yaml

# TEMPORARY — this patch should be removed, not kept as a permanent workaround.
#
# It strips the --creds-manager-ca-path arg the infra-controller submodule
# bump (to 5a8745f4) added to nico-rest-site-manager's chart template. The
# *values* for it are already correct in this repo (nico-rest-cert-manager's
# caSigningSecret already matches the chart's credsManagerCa default) — the
# actual problem is that the deployed nico-rest-site-manager image
# (IMAGE_TAG=latest) was built from an older infra-controller commit whose
# binary doesn't recognize this flag yet, so the pod CrashLoopBackOffs on an
# unrecognized-flag error. This patch just hides the symptom by not rendering
# the flag at all.
#
# Real fix: publish/pull a nico-rest-site-manager image built from (or past)
# the currently-pinned submodule commit, so the chart and the binary agree on
# the CLI surface again. A floating `latest` tag is how this class of skew
# happens — pinning IMAGE_TAG to a specific tag/digest built from the same
# submodule commit would have caught this before deploy. Once the image is in
# sync, delete this kustomization directory and drop CLOUD_KUSTOMIZE's
# --post-renderer/--post-renderer-args wiring from the Makefile's deploy-cloud
# target.
patches:
  - target:
      kind: Deployment
      name: nico-rest-site-manager
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/args/2
