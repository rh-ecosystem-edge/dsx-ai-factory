{{/*
SPDX-FileCopyrightText: Copyright (c) 2026 Red Hat, Inc. All rights reserved.
SPDX-License-Identifier: Apache-2.0

Grant nonroot-v2 SCC to the default ServiceAccount in the nico-rest namespace.
The upstream nico-rest-db migration Job hardcodes runAsUser: 1000 / fsGroup: 1000,
which is rejected by OpenShift's restricted-v2 SCC (UID must be in the namespace
allocated range). nonroot-v2 allows any non-root UID including 1000.
Kustomize post-renderer cannot reach Helm hook resources, so this namespace-level
binding is the only viable fix without modifying the upstream chart.
*/}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nico-rest-migration-nonroot-v2-scc
  labels:
    {{- include "nvidia-infra-controller-cloud-infra.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:nonroot-v2
subjects:
  - kind: ServiceAccount
    name: default
    namespace: {{ .Release.Namespace }}
